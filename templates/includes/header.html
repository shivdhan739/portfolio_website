
{% load static %}

<header class="site-header">
    <nav class="navbar navbar-expand-lg" aria-label="Main navigation">
        <div class="container">
            <!-- Brand -->
            <a class="navbar-brand brand-logo" href="{% url 'home' %}">
                <span class="brand-icon">S</span>
                <span>Shivdhan<span class="brand-highlight">.</span></span>
            </a>

            <!-- Mobile Menu Button -->
            <button
                class="navbar-toggler custom-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation Links -->
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">

                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
                           href="{% url 'home' %}">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}"
                           href="{% url 'about' %}">
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'skills' %}active{% endif %}"
                           href="{% url 'skills' %}">
                            Skills
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'projects' %}active{% endif %}"
                           href="{% url 'projects' %}">
                            Projects
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'education' %}active{% endif %}"
                           href="{% url 'education' %}">
                            Education
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}"
                           href="{% url 'contact' %}">
                            Contact
                        </a>
                    </li>

                    <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                        <a class="btn btn-primary-custom"
                           href="{% url 'contact' %}">
                            Let's Talk
                            <i class="bi bi-arrow-up-right ms-1"></i>
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
</header>
